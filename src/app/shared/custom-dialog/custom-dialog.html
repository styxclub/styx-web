<p>{{ message() }}</p>
<div class="actions">
    @if (showConfirm()) {
    <button pButton
            (click)="ref.close(false)"
            severity="danger">
        Cancelar
    </button>
    }
    <button pButton
            (click)="ref.close(true)"
            severity="success">
        Aceptar
    </button>
</div>
