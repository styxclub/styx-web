<div class="header">
    <div class="header-inner">STYX</div>
    <div class="header-options">
        <div class="user-credits"
             [pTooltip]="`Tienes ${authStore.credits()} créditos disponibles`">
            <svg data-p-icon="dollar"
                 [size]="ICON_SIZES.LARGE"></svg>
            {{ authStore.credits() }}
        </div>
        <button pButton
                iconOnly
                pTooltip="Cerrar sesión"
                (click)="logout()">
            <svg data-p-icon="power-off"
                 [size]="ICON_SIZES.NORMAL"></svg>
        </button>
    </div>
</div>
